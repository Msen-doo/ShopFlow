name: Deploy to ECS

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "423389601516"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, cart-service, order-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/shopflow/${{ matrix.service }}:$IMAGE_TAG -t $ECR_REGISTRY/shopflow/${{ matrix.service }}:latest ./${{ matrix.service }}
          docker push $ECR_REGISTRY/shopflow/${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/shopflow/${{ matrix.service }}:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster shopflow \
            --service shopflow-${{ matrix.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster shopflow \
            --services shopflow-${{ matrix.service }} \
            --region ${{ env.AWS_REGION }}
