# docker-compose.yml
version: '3.9'
 
services:
 
  # ── Databases ────────────────────────────────────
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       userdb
      POSTGRES_USER:     shopflow
      POSTGRES_PASSWORD: shopflow_secret
    volumes: [pgdata-user:/var/lib/postgresql/data]
 
  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       productdb
      POSTGRES_USER:     shopflow
      POSTGRES_PASSWORD: shopflow_secret
    volumes: [pgdata-product:/var/lib/postgresql/data]
 
  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       orderdb
      POSTGRES_USER:     shopflow
      POSTGRES_PASSWORD: shopflow_secret
    volumes: [pgdata-order:/var/lib/postgresql/data]
 
  redis:
    image: redis:7-alpine
 
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs
      DEFAULT_REGION: eu-west-1
    ports: ['4566:4566']
 
  # ── Application Services ─────────────────────────
  user-service:
    build: ./user-service
    environment:
      DATABASE_URL:   postgresql://shopflow:shopflow_secret@postgres-user/userdb
      JWT_SECRET_KEY: local_dev_secret_change_in_prod
    depends_on: [postgres-user]
    ports: ['8001:8000']
 
  product-service:
    build: ./product-service
    environment:
      DATABASE_URL:        postgresql://shopflow:shopflow_secret@postgres-product/productdb
      SQS_ORDER_QUEUE_URL: http://localstack:4566/000000000000/shopflow-orders.fifo
      AWS_REGION:          eu-west-1
      AWS_ACCESS_KEY_ID:   test
      AWS_SECRET_ACCESS_KEY: test
    depends_on: [postgres-product, localstack]
    ports: ['8002:8000']
 
  cart-service:
    build: ./cart-service
    environment:
      REDIS_URL:      redis://redis:6379/0
      JWT_SECRET_KEY: local_dev_secret_change_in_prod
    depends_on: [redis]
    ports: ['8003:8000']
 
  order-service:
    build: ./order-service
    environment:
      DATABASE_URL:        postgresql://shopflow:shopflow_secret@postgres-order/orderdb
      SQS_ORDER_QUEUE_URL: http://localstack:4566/000000000000/shopflow-orders.fifo
      JWT_SECRET_KEY:      local_dev_secret_change_in_prod
      AWS_REGION:          eu-west-1
      AWS_ACCESS_KEY_ID:   test
      AWS_SECRET_ACCESS_KEY: test
    depends_on: [postgres-order, localstack, cart-service]
    ports: ['8004:8000']
 
volumes:
  pgdata-user:
  pgdata-product:
  pgdata-order:
